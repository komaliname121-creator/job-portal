<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jobify</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f7ff;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            width: 100%;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            width: 92%;
            max-width: 1200px;
            margin: auto;

            min-height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* LOGO */

        .logo {
            text-decoration: none;

            font-size: 30px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #4f46e5,
                #9333ea,
                #ec4899
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* NAV LINKS */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;

            color: #374151;

            font-size: 16px;
            font-weight: 600;

            padding: 10px 5px;

            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #6366f1;
        }

        .nav-links a.active {
            color: #6366f1;

            border-bottom: 3px solid #6366f1;
        }

        /* BUTTONS */

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .login-btn {
            padding: 10px 18px;

            border: 2px solid #6366f1;

            border-radius: 8px;

            background: white;

            color: #6366f1;

            font-weight: bold;
        }

        .signup-btn {
            padding: 11px 19px;

            border: none;

            border-radius: 8px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #9333ea
            );

            color: white;

            font-weight: bold;
        }

        /* MOBILE */

        @media(max-width: 800px) {

            .nav-container {
                flex-direction: column;

                gap: 18px;

                padding: 20px 0;
            }

            .nav-links {
                flex-wrap: wrap;

                justify-content: center;

                gap: 15px;
            }

            .nav-buttons {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="nav-container">


            <!-- LOGO -->

            <a href="index.html" class="logo">
                Jobify
            </a>


            <!-- LINKS -->

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="about.html">
                    About
                </a>

                <!-- EXACT FILE NAME -->
                <a href="applications.html">
                    Applications
                </a>

                <a href="profile.html">
                    Profile
                </a>

                <a href="resume.html">
                    Resume
                </a>

            </div>


            <!-- BUTTONS -->

            <div class="nav-buttons">

                <button class="login-btn">
                    Login
                </button>

                <button class="signup-btn">
                    Sign Up
                </button>

            </div>


        </div>

    </nav>


</body>

</html>
